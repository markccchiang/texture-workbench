<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 488" width="960" height="488" role="img" aria-labelledby="title desc" font-family="'Inter', 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <title id="title">Pixel spacing</title>
  <desc id="desc">From the file: ReadImageSize reads the resolution of PNG, JPEG, BMP and TIFF files; LoadedImage.info.pixel_spacing keeps it, swapped when the EXIF orientation turns the image; decodeImageFile returns it and the server stores it in ImageInfo.pixelSpacing, null without one. In the web app, viewerStore.pixelSpacing holds the spacing chosen for the image earlier or else the file&#x27;s, edited in the Image Info dialog; it drives the scale bar, ROI areas in mm² and the note on non-square pixels. Into the results: POST /analyses sends the spacing, AnalysisInfo keeps it with the run, the results document carries it as image.pixelSpacing, and ResultsToCsv writes # pixelSpacingMm and the areaMm2 column.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="960" height="488" fill="#ffffff"/>
