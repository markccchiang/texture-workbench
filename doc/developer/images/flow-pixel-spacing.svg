  <path d="M244.0,290.0 L272.0,290.0 L272.0,264.0 L303.0,264.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <path d="M831.0,117.0 L831.0,150.0 L430.0,150.0 L430.0,221.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <text x="640.0" y="143.0" font-size="11" fill="#64748b" font-weight="600">else the file's</text>
  <g filter="url(#shadow)"><rect x="630.0" y="199.0" width="300" height="30" rx="10" fill="#eef4fe" stroke="#bcd2f7" stroke-width="1.4"/></g>
