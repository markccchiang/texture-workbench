  <text x="129.0" y="87.0" font-size="12.5" fill="#1e293b" font-weight="600" text-anchor="middle" font-family="'SFMono-Regular', Menlo, Consolas, monospace">ReadImageSize</text>
  <text x="129.0" y="103.0" font-size="10.5" fill="#64748b" text-anchor="middle" font-family="'SFMono-Regular', Menlo, Consolas, monospace">pHYs · JFIF · BMP · TIFF</text>
  <g filter="url(#shadow)"><rect x="258.0" y="63.0" width="210" height="54" rx="10" fill="#fff5e8" stroke="#f5cf9c" stroke-width="1.4"/></g>
