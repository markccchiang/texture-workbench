  <text x="363.0" y="103.0" font-size="10.5" fill="#64748b" text-anchor="middle" font-family="'SFMono-Regular', Menlo, Consolas, monospace">pixel_spacing · EXIF swap</text>
  <g filter="url(#shadow)"><rect x="492.0" y="63.0" width="210" height="54" rx="10" fill="#f3eefc" stroke="#d6c6f5" stroke-width="1.4"/></g>
  <text x="597.0" y="87.0" font-size="12.5" fill="#1e293b" font-weight="600" text-anchor="middle" font-family="'SFMono-Regular', Menlo, Consolas, monospace">decodeImageFile()</text>
  <text x="597.0" y="103.0" font-size="10.5" fill="#64748b" text-anchor="middle" font-family="'SFMono-Regular', Menlo, Consolas, monospace">pixelSpacing</text>
  <g filter="url(#shadow)"><rect x="726.0" y="63.0" width="210" height="54" rx="10" fill="#edf8f1" stroke="#b7e2c8" stroke-width="1.4"/></g>
  <text x="831.0" y="87.0" font-size="12.5" fill="#1e293b" font-weight="600" text-anchor="middle" font-family="'SFMono-Regular', Menlo, Consolas, monospace">ImageInfo</text>
  <text x="831.0" y="103.0" font-size="10.5" fill="#64748b" text-anchor="middle" font-family="'SFMono-Regular', Menlo, Consolas, monospace">pixelSpacing · null if none</text>
