  <g filter="url(#shadow)"><rect x="630.0" y="239.0" width="300" height="30" rx="10" fill="#eef4fe" stroke="#bcd2f7" stroke-width="1.4"/></g>
  <text x="780.0" y="258.5" font-size="12.5" fill="#1e293b" font-weight="600" text-anchor="middle">ROI areas in mm²</text>
  <path d="M555.0,254.0 L590.0,254.0 L590.0,254.0 L628.0,254.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)"><rect x="630.0" y="279.0" width="300" height="30" rx="10" fill="#eef4fe" stroke="#bcd2f7" stroke-width="1.4"/></g>
  <text x="780.0" y="298.5" font-size="12.5" fill="#1e293b" font-weight="600" text-anchor="middle">Note on non-square pixels</text>
  <path d="M555.0,254.0 L590.0,254.0 L590.0,294.0 L628.0,294.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <text x="24.0" y="350.0" font-size="10.5" fill="#64748b" font-weight="700" letter-spacing="0.08em">INTO THE RESULTS</text>
  <g filter="url(#shadow)"><rect x="24.0" y="378.0" width="210" height="54" rx="10" fill="#edf8f1" stroke="#b7e2c8" stroke-width="1.4"/></g>
  <text x="129.0" y="402.0" font-size="12.5" fill="#1e293b" font-weight="600" text-anchor="middle">Start an analysis</text>
  <text x="129.0" y="418.0" font-size="10.5" fill="#64748b" text-anchor="middle" font-family="'SFMono-Regular', Menlo, Consolas, monospace">POST /analyses {pixelSpacing}</text>
  <g filter="url(#shadow)"><rect x="258.0" y="378.0" width="210" height="54" rx="10" fill="#edf8f1" stroke="#b7e2c8" stroke-width="1.4"/></g>
