<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 547" width="960" height="547" role="img" aria-labelledby="title desc" font-family="'Inter', 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <title id="title">Opening an image</title>
  <desc id="desc">The browser uploads the file with POST /images. The server streams it to uploads/, computes its SHA-256 and calls decodeImageFile in the addon, which checks the size from the header, loads the image and computes display statistics and the pixel spacing. The server writes images/&lt;id&gt;/ and answers 201 with ImageInfo. The browser then downloads the raw pixels with GET /images/{id}/raw and renders them as a WebGL2 texture.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="960" height="547" fill="#ffffff"/>
  <line x1="160" y1="82" x2="160" y2="501.0" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 5"/>
  <line x1="480" y1="82" x2="480" y2="501.0" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 5"/>
  <line x1="800" y1="82" x2="800" y2="501.0" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 5"/>
  <g filter="url(#shadow)"><rect x="40" y="20" width="240" height="62" rx="12" fill="#eef4fe" stroke="#3b73d9" stroke-width="1.5"/></g>
  <path d="M40,32 A12,12 0 0 1 52,20 H268 A12,12 0 0 1 280,32 V50 H40 Z" fill="#3b73d9"/>
  <text x="160.0" y="40.0" font-size="13.5" fill="#ffffff" font-weight="700" text-anchor="middle">Browser · web app</text>
  <text x="160.0" y="70.0" font-size="11" fill="#64748b" text-anchor="middle" font-family="'SFMono-Regular', Menlo, Consolas, monospace">web/src</text>
  <g filter="url(#shadow)"><rect x="360" y="20" width="240" height="62" rx="12" fill="#edf8f1" stroke="#2e9d62" stroke-width="1.5"/></g>
  <path d="M360,32 A12,12 0 0 1 372,20 H588 A12,12 0 0 1 600,32 V50 H360 Z" fill="#2e9d62"/>
  <text x="480.0" y="40.0" font-size="13.5" fill="#ffffff" font-weight="700" text-anchor="middle">API server</text>
  <text x="480.0" y="70.0" font-size="11" fill="#64748b" text-anchor="middle" font-family="'SFMono-Regular', Menlo, Consolas, monospace">server/src</text>
  <g filter="url(#shadow)"><rect x="680" y="20" width="240" height="62" rx="12" fill="#fff5e8" stroke="#e07b00" stroke-width="1.5"/></g>
  <path d="M680,32 A12,12 0 0 1 692,20 H908 A12,12 0 0 1 920,32 V50 H680 Z" fill="#e07b00"/>
  <text x="800.0" y="40.0" font-size="13.5" fill="#ffffff" font-weight="700" text-anchor="middle">Addon · C++ core</text>
  <text x="800.0" y="70.0" font-size="11" fill="#64748b" text-anchor="middle" font-family="'SFMono-Regular', Menlo, Consolas, monospace">@glcm/native · glcm_core</text>
  <line x1="165" y1="128.0" x2="473" y2="128.0" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <circle cx="182" cy="114.0" r="9" fill="#3b73d9"/>
  <text x="182.0" y="117.5" font-size="10.5" fill="#ffffff" font-weight="700" text-anchor="middle">1</text>
  <text x="198.0" y="118.0" font-size="11.5" fill="#1e293b" font-family="'SFMono-Regular', Menlo, Consolas, monospace">POST /images (multipart)</text>
  <rect x="380.3" y="142.0" width="199.4" height="27" rx="8" fill="#edf8f1" stroke="#b7e2c8" stroke-width="1.2"/>
  <text x="480.0" y="161.0" font-size="11" fill="#334155" text-anchor="middle">stream to uploads/ · SHA-256</text>
  <line x1="485" y1="201.0" x2="793" y2="201.0" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <circle cx="502" cy="187.0" r="9" fill="#2e9d62"/>
  <text x="502.0" y="190.5" font-size="10.5" fill="#ffffff" font-weight="700" text-anchor="middle">2</text>
  <text x="518.0" y="191.0" font-size="11.5" fill="#1e293b" font-family="'SFMono-Regular', Menlo, Consolas, monospace">decodeImageFile(path, maxPixels)</text>
  <rect x="641.8" y="215.0" width="302.2" height="42" rx="8" fill="#fff5e8" stroke="#f5cf9c" stroke-width="1.2"/>
  <text x="792.9" y="234.0" font-size="11" fill="#334155" text-anchor="middle">size from the header, then LoadImageStackFile</text>
  <text x="792.9" y="249.0" font-size="11" fill="#334155" text-anchor="middle">display statistics · pixel spacing</text>
  <line x1="795" y1="289.0" x2="487" y2="289.0" stroke="#64748b" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arrow-muted)"/>
  <circle cx="778" cy="275.0" r="9" fill="#e07b00"/>
  <text x="778.0" y="278.5" font-size="10.5" fill="#ffffff" font-weight="700" text-anchor="middle">3</text>
  <text x="762.0" y="279.0" font-size="11.5" fill="#1e293b" text-anchor="end" font-family="'SFMono-Regular', Menlo, Consolas, monospace">pixels · window · histogram</text>
  <rect x="404.6" y="303.0" width="150.8" height="27" rx="8" fill="#e8f7f8" stroke="#a9dde2" stroke-width="1.2"/>
  <text x="480.0" y="322.0" font-size="11" fill="#334155" text-anchor="middle" font-family="'SFMono-Regular', Menlo, Consolas, monospace">write images/&lt;id&gt;/</text>
  <line x1="475" y1="362.0" x2="167" y2="362.0" stroke="#64748b" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arrow-muted)"/>
  <circle cx="458" cy="348.0" r="9" fill="#2e9d62"/>
  <text x="458.0" y="351.5" font-size="10.5" fill="#ffffff" font-weight="700" text-anchor="middle">4</text>
  <text x="442.0" y="352.0" font-size="11.5" fill="#1e293b" text-anchor="end" font-family="'SFMono-Regular', Menlo, Consolas, monospace">201 ImageInfo (transfer raw or server)</text>
  <line x1="165" y1="400.0" x2="473" y2="400.0" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <circle cx="182" cy="386.0" r="9" fill="#3b73d9"/>
  <text x="182.0" y="389.5" font-size="10.5" fill="#ffffff" font-weight="700" text-anchor="middle">5</text>
  <text x="198.0" y="390.0" font-size="11.5" fill="#1e293b" font-family="'SFMono-Regular', Menlo, Consolas, monospace">GET /images/{id}/raw</text>
  <line x1="475" y1="438.0" x2="167" y2="438.0" stroke="#64748b" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arrow-muted)"/>
  <circle cx="458" cy="424.0" r="9" fill="#2e9d62"/>
  <text x="458.0" y="427.5" font-size="10.5" fill="#ffffff" font-weight="700" text-anchor="middle">6</text>
  <text x="442.0" y="428.0" font-size="11.5" fill="#1e293b" text-anchor="end" font-family="'SFMono-Regular', Menlo, Consolas, monospace">pixels.bin (gzip or zstd) · ETag</text>
  <rect x="54.2" y="452.0" width="211.5" height="27" rx="8" fill="#eef4fe" stroke="#bcd2f7" stroke-width="1.2"/>
  <text x="160.0" y="471.0" font-size="11" fill="#334155" text-anchor="middle">WebGL2 texture · fit to window</text>
  <line x1="686" y1="523.0" x2="730" y2="523.0" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="738.0" y="527.0" font-size="11" fill="#64748b">request</text>
  <line x1="818" y1="523.0" x2="862" y2="523.0" stroke="#64748b" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arrow-muted)"/>
  <text x="870.0" y="527.0" font-size="11" fill="#64748b">response</text>
</svg>
