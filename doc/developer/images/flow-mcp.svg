  <rect x="398.4" y="744.0" width="163.1" height="42" rx="8" fill="#eef4fe" stroke="#bcd2f7" stroke-width="1.2"/>
  <text x="480.0" y="763.0" font-size="11" fill="#334155" text-anchor="middle">kept as "regions_1":</text>
  <text x="480.0" y="778.0" font-size="11" fill="#334155" text-anchor="middle">the outlines stay here</text>
  <line x1="475" y1="818.0" x2="167" y2="818.0" stroke="#64748b" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arrow-muted)"/>
