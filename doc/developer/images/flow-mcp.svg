  <text x="480.0" y="316.0" font-size="11" fill="#334155" text-anchor="middle">upload only what is new</text>
  <line x1="485" y1="356.0" x2="793" y2="356.0" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <circle cx="502" cy="342.0" r="9" fill="#3b73d9"/>
