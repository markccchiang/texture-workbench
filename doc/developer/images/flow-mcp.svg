  <g filter="url(#shadow)"><rect x="40" y="20" width="240" height="62" rx="12" fill="#eef4fe" stroke="#3b73d9" stroke-width="1.5"/></g>
  <path d="M40,32 A12,12 0 0 1 52,20 H268 A12,12 0 0 1 280,32 V50 H40 Z" fill="#3b73d9"/>
  <text x="160.0" y="40.0" font-size="13.5" fill="#ffffff" font-weight="700" text-anchor="middle">AI assistant</text>
  <text x="160.0" y="70.0" font-size="11" fill="#64748b" text-anchor="middle" font-family="'SFMono-Regular', Menlo, Consolas, monospace">an MCP client</text>
  <g filter="url(#shadow)"><rect x="360" y="20" width="240" height="62" rx="12" fill="#eef4fe" stroke="#3b73d9" stroke-width="1.5"/></g>
  <path d="M360,32 A12,12 0 0 1 372,20 H588 A12,12 0 0 1 600,32 V50 H360 Z" fill="#3b73d9"/>
  <text x="480.0" y="40.0" font-size="13.5" fill="#ffffff" font-weight="700" text-anchor="middle">glcm mcp</text>
  <text x="480.0" y="70.0" font-size="11" fill="#64748b" text-anchor="middle" font-family="'SFMono-Regular', Menlo, Consolas, monospace">cli/src/mcp.ts</text>
  <g filter="url(#shadow)"><rect x="680" y="20" width="240" height="62" rx="12" fill="#edf8f1" stroke="#2e9d62" stroke-width="1.5"/></g>
  <path d="M680,32 A12,12 0 0 1 692,20 H908 A12,12 0 0 1 920,32 V50 H680 Z" fill="#2e9d62"/>
  <text x="800.0" y="40.0" font-size="13.5" fill="#ffffff" font-weight="700" text-anchor="middle">API server · core</text>
  <text x="800.0" y="70.0" font-size="11" fill="#64748b" text-anchor="middle" font-family="'SFMono-Regular', Menlo, Consolas, monospace">in process or over HTTP</text>
