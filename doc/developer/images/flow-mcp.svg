<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 1094" width="960" height="1094" role="img" aria-labelledby="title desc" font-family="'Inter', 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <title id="title">An assistant measuring over MCP</title>
  <desc id="desc">The assistant lists the tools over standard input and output, then opens an image: the MCP server reads the file, hashes it and uploads it only when the server does not have it, and answers with the size, bit depth, window and spacing. view_image returns the rendering as a picture the model can look at. select_regions asks the server for the regions in an intensity range and keeps their polygons under an id, so the outlines never travel through the model. measure then names that id: the server runs the analysis and the tool answers with a shortened table, writing the whole table to a file when saveTo is given.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="960" height="1094" fill="#ffffff"/>
  <line x1="160" y1="82" x2="160" y2="1048.0" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 5"/>
