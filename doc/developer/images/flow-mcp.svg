  <text x="442.0" y="422.0" font-size="11.5" fill="#1e293b" text-anchor="end" font-family="'SFMono-Regular', Menlo, Consolas, monospace">size · bit depth · window · spacing</text>
  <line x1="165" y1="470.0" x2="473" y2="470.0" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <circle cx="182" cy="456.0" r="9" fill="#3b73d9"/>
  <text x="182.0" y="459.5" font-size="10.5" fill="#ffffff" font-weight="700" text-anchor="middle">7</text>
