  <text x="518.0" y="498.0" font-size="11.5" fill="#1e293b" font-family="'SFMono-Regular', Menlo, Consolas, monospace">GET /images/{id}/display.png</text>
  <line x1="795" y1="546.0" x2="487" y2="546.0" stroke="#64748b" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arrow-muted)"/>
  <circle cx="778" cy="532.0" r="9" fill="#2e9d62"/>
  <text x="778.0" y="535.5" font-size="10.5" fill="#ffffff" font-weight="700" text-anchor="middle">9</text>
