# Continuous integration (doc/ui-design-plan.md, sections 8.3 and 8.6): core, addon, server, web and end-to-end tests
# on macOS (arm64) and Ubuntu (x86_64), and the Docker image with a smoke test.
#
# Actions are pinned to commit SHAs (the version is in the comment); .github/dependabot.yml proposes updates.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # A hanging step fails the job instead of holding a runner for GitHub's default of 6 hours
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install C++ dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake g++ libopencv-dev libeigen3-dev nlohmann-json3-dev zlib1g-dev libgtest-dev

      - name: Install C++ dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install opencv eigen nlohmann-json googletest

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Core library and tests
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel
          ctest --test-dir build --output-on-failure

      - name: Install npm packages
        run: npm ci

      - name: Build the Node-API addon
        run: npm run build:native

      - name: Type check
        run: npm run typecheck

      - name: Unit tests (addon, server, web)
        run: npm test

      - name: Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      # Browser builds match the Playwright version, so they are cached per version and operating system
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/ms-playwright
            ~/Library/Caches/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}

      - name: End-to-end tests (Chromium, WebKit)
        run: |
          npx playwright install --with-deps chromium webkit
          npm run test:e2e

      - name: Keep test results of failed runs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-${{ matrix.os }}
          path: test-results
          if-no-files-found: ignore

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # Layers are cached in the GitHub Actions cache, so unchanged dependency layers are not rebuilt
      - name: Build the image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          tags: texture-workbench
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      # A port other than 8080 also checks that the image's health check follows GLCM_PORT
      - name: Smoke test in server mode
        run: |
          export GLCM_API_TOKEN="$(openssl rand -base64 32)"
          docker run -d --name glcm -p 8080:9090 -e GLCM_PORT=9090 -e GLCM_API_TOKEN texture-workbench
          for attempt in $(seq 1 30); do
            curl -sf http://127.0.0.1:8080/api/v1/health && break
            sleep 2
          done
          node scripts/smoke-test.mjs http://127.0.0.1:8080

      # The image also ships the command line, which goes through the server running in the same container
      - name: The command line in the image
        run: |
          docker exec -e GLCM_API_TOKEN glcm glcm features --presets --server http://127.0.0.1:9090 | grep -q haralick
          docker exec -e GLCM_API_TOKEN glcm glcm measure sample:textures/brick.png \
            --server http://127.0.0.1:9090 --features Contrast --aggregation meanOnly --json | grep -q '"Contrast"'
          # Without --server it would build a second server on /data and empty the folders the running one uses
          docker exec glcm glcm features 2>&1 | grep -q 'is using /data'
          # MCP is left out of the image on purpose, and says so instead of failing obscurely
          docker exec glcm glcm mcp 2>&1 | grep -q 'MCP support is not installed here'

      - name: Health check reports healthy
        run: |
          for attempt in $(seq 1 30); do
            status="$(docker inspect --format '{{.State.Health.Status}}' glcm)"
            echo "health: $status"
            [ "$status" = healthy ] && exit 0
            [ "$status" = unhealthy ] && exit 1
            sleep 5
          done
          exit 1

      - name: Container logs
        if: always()
        run: docker logs glcm || true
